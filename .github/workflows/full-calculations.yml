name: Full calculation verification

on:
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculation-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  calculations:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-suite'
    name: Numerical regression and sustained comparisons
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HOME: /root
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Trust this checkout in the test container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: processing/uv.lock
      - run: npm ci
      - run: uv sync --project processing --frozen
      - run: npm run test:all
        env:
          TEST_ARTIFACT_DIR: /tmp/nisar-calculation-full
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: calculation-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/nisar-calculation-full
          retention-days: 7
          if-no-files-found: warn
