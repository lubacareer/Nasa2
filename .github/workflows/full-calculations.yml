name: Full calculation verification

on:
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:
    inputs:
      publish_image:
        description: Build, smoke-test both Linux architectures, then publish the PR image
        type: boolean
        required: false
        default: false
      pr_number:
        description: Pull request number for the Docker Hub pr-<number> tag
        type: string
        required: false
        default: '3'

permissions:
  contents: read

jobs:
  calculations:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-suite'
    concurrency:
      group: calculation-full-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    name: Numerical regression and sustained comparisons
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HOME: /root
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Trust this checkout in the test container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: processing/uv.lock
      - run: npm ci
      - run: uv sync --project processing --frozen
      - run: npm run test:all
        env:
          TEST_ARTIFACT_DIR: /tmp/nisar-calculation-full
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: calculation-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/nisar-calculation-full
          retention-days: 7
          if-no-files-found: warn

  container-smoke:
    name: Linux desktop container (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' && inputs.publish_image
    needs: calculations
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build the native container image
        run: docker buildx build --platform ${{ matrix.platform }} --load --tag nisar-surface-change:ci .
      - name: Check password enforcement, Electron preview, and noVNC
        env:
          NISAR_CONTAINER_ARCH: ${{ matrix.arch }}
        run: node tests/docker-image-smoke.mjs

  publish-docker:
    name: Publish Docker Hub image
    if: github.event_name == 'workflow_dispatch' && inputs.publish_image
    needs: [calculations, container-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate the PR number input
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          WORKFLOW_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Enter a numeric pull request number." >&2
            exit 64
          fi
          pull_request="$(gh api "repos/lubacareer/Nasa2/pulls/$PR_NUMBER")"
          if [[ "$(jq -r .state <<<"$pull_request")" != "open" || "$(jq -r .head.sha <<<"$pull_request")" != "$WORKFLOW_SHA" ]]; then
            echo "The selected branch must be the current head of the open PR being tagged." >&2
            exit 65
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: lubani27
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            lubani27/nisar-surface-change:pr-${{ inputs.pr_number }}
            lubani27/nisar-surface-change:sha-${{ github.sha }}
