name: Foundation checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Calculations and three-browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOME: /root
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust this checkout in the test container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: processing/uv.lock
      - run: uv sync --project processing --frozen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:validator
      - run: node --test tests/publish-guards.test.mjs
      - run: npm run test:dev
      - run: npm run test:runner
      - run: npm run test:e2e
        env:
          TEST_ARTIFACT_DIR: /tmp/nisar-calculation-functional
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: calculation-functional-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/nisar-calculation-functional
          retention-days: 7
          if-no-files-found: warn

  processing:
    name: Python and data contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: processing/uv.lock
      - run: uv sync --project processing --frozen
      - run: uv run --project processing ruff check processing
      - run: uv run --project processing pytest processing/tests
      - run: uv run --project processing python -m nisar_preview validate
      - run: uv run --project processing python -m nisar_preview generate --check
